<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - TeleMed</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🩺 TeleMed
        </div>

        <h2>Create Account</h2>

        <p>
            Join TeleMed today
        </p>


        <form id="registerForm">

            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Full name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                required
            >


            <label>Phone</label>

            <input
                type="tel"
                id="phone"
                placeholder="10 digit phone number"
                required
            >


            <label>Date of Birth</label>

            <input
                type="date"
                id="dateOfBirth"
            >


            <label>Gender</label>

            <select id="gender">

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Address</label>

            <input
                type="text"
                id="address"
                placeholder="Address"
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
