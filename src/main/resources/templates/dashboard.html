<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - TeleMed</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="dashboard-nav">

    <div class="logo">
        🩺 TeleMed
    </div>


    <div>

        <span id="userName"></span>

        <button
            onclick="logout()"
            class="logout-btn">

            Logout

        </button>

    </div>

</header>


<main class="dashboard">

    <div class="welcome">

        <p>WELCOME BACK</p>

        <h1>
            Hello, <span id="name"></span> 👋
        </h1>

        <p>
            Manage your healthcare from one place.
        </p>

    </div>


    <div class="dashboard-grid">

        <a href="doctors.html"
           class="dashboard-card">

            <div>👨‍⚕️</div>

            <h3>
                Find Doctors
            </h3>

            <p>
                Search and view available doctors.
            </p>

        </a>


        <a href="appointments.html"
           class="dashboard-card">

            <div>📅</div>

            <h3>
                Appointments
            </h3>

            <p>
                View and manage your appointments.
            </p>

        </a>


        <a href="consultations.html"
           class="dashboard-card">

            <div>💻</div>

            <h3>
                Consultations
            </h3>

            <p>
                View your consultation history.
            </p>

        </a>


        <a href="payments.html"
           class="dashboard-card">

            <div>💳</div>

            <h3>
                Payments
            </h3>

            <p>
                View your payment history.
            </p>

        </a>

    </div>

</main>


<script src="js/dashboard.js"></script>

</body>

</html>
