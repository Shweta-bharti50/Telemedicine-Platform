<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - TeleMed</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🩺 TeleMed
        </div>

        <h2>Welcome Back</h2>

        <p>
            Login to your TeleMed account
        </p>


        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>

</body>

</html>
